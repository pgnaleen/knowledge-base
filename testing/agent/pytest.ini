[pytest]
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    level1: no servers required — pure unit tests with mocked dependencies
    level2: requires kb-api running on port 8000 (docker compose up kb-api postgres redis minio)
    level3: requires full stack on ports 8000 and 8001 (docker compose up)
addopts = -v --tb=short
