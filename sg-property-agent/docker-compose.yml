services:

  mcp-server:
    build: ./mcp-server
    expose:
      - "8002"          # internal only — not exposed to the internet
    environment:
      # When KB-Pipeline runs via its own docker-compose on the host,
      # use host.docker.internal to reach it from inside this container.
      # Change to a service name if you merge both compose files.
      KB_PIPELINE_URL: http://host.docker.internal:8000
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      MCP_SERVER_URL: http://mcp-server:8002/mcp
    depends_on:
      - mcp-server
    restart: unless-stopped
