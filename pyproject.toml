[project]
name = "knowledge-base"
version = "1.0.0"
description = "AI-Powered Property Advisory - Knowledge Base Data Pipeline"
requires-python = ">=3.11"
dependencies = [
    # Web Crawling
    "scrapy>=2.11",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # PDF Extraction
    "pdfplumber>=0.11",
    "pymupdf>=1.24",

    # Text Processing & Chunking
    "langchain-text-splitters>=0.1",
    "tiktoken>=0.7",

    # Embeddings & Vector Store
    "openai>=1.30",
    "pinecone>=5.0",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",

    # Storage
    "boto3>=1.34",

    # API
    "fastapi>=0.110",
    "uvicorn>=0.29",

    # Task Queue
    "celery[redis]>=5.3",

    # Utilities
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rank-bm25>=0.2",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
include = ["config*", "crawlers*", "processors*", "embedders*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=crawlers --cov=processors --cov=embedders --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: requires live infrastructure (PostgreSQL, MinIO, network)",
    "slow: makes live HTTP requests to government sites",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
