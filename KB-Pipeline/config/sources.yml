# Government source definitions for crawlers
sources:
  hdb:
    schedule:
      full: "0 2 * * 0"        # Weekly Sunday 2AM SGT
      incremental: "0 6 * * *"  # Daily 6AM SGT
    name: "Housing & Development Board"
    base_url: "https://www.hdb.gov.sg"
    start_urls:
      - "https://www.hdb.gov.sg/buying-a-flat"
      - "https://www.hdb.gov.sg/managing-my-home"
      - "https://www.hdb.gov.sg/renting-a-flat"
    allowed_domains:
      - "www.hdb.gov.sg"
      - "hdb.gov.sg"
    content_types:
      - "eligibility"
      - "schemes"
      - "grants"
      - "resale_rules"
      - "bto_info"
    js_rendering: true
    crawl_delay: 2.0
    estimated_pages: 300
    respect_robots_txt: true
    target_prefixes:
      - "/buying-a-flat"
      - "/managing-my-home"
      - "/renting-a-flat"
    skip_prefixes:
      - "/feedback"
      - "/careers"
      - "/eservices"
      - "/news"
      - "/publications"
      - "/corporate"
      - "/my-nice-home-gallery"
      - "/home-gallery"
      - "/virtual-tour"
    blocked_subdomains:
      - "assets.hdb.gov.sg"
    playwright_wait_event: "domcontentloaded"
    min_content_length: 100
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    content_selectors:
      - "main#main-content"
      - "div.hdb-content"
      - "main"
      - "article"
    tag_config:
      property_type:
        HDB: ["hdb flat", "hdb"]
        private: ["private residential", "condominium", "condo"]
        EC: ["executive condominium", "ec "]
        commercial: ["commercial property", "industrial"]
      citizenship:
        SC: ["singapore citizen"]
        PR: ["permanent resident", "pr"]
        foreigner: ["foreigner", "non-resident", "non-citizen"]
      topic:
        stamp_duty: ["stamp duty", "absd", "bsd", "ssd"]
        ltv: ["loan-to-value", "ltv"]
        tdsr: ["tdsr", "total debt servicing"]
        msr: ["msr", "mortgage servicing ratio"]
        housing_grant: ["ehg", "phg", "family grant", "proximity housing grant"]
        eligibility: ["eligibility"]
        first_time_buyer: ["first-time", "first time"]
        cooling_measure: ["cooling measure"]
        property_tax: ["property tax"]
        rental: ["rental", "rent"]

  ura:
    schedule:
      full: "0 2 * * 0"
      incremental: "0 6 * * *"
    name: "Urban Redevelopment Authority"
    base_url: "https://www.ura.gov.sg"
    start_urls:
      - "https://www.ura.gov.sg/Corporate/Property"
      - "https://www.ura.gov.sg/Corporate/Guidelines"
    allowed_domains:
      - "www.ura.gov.sg"
      - "ura.gov.sg"
    content_types:
      - "property_guidelines"
      - "development_rules"
      - "private_property_regulations"
    js_rendering: false
    crawl_delay: 2.0
    estimated_pages: 250
    respect_robots_txt: false
    target_prefixes:
      - "/Corporate/Property"
      - "/Corporate/Guidelines"
    skip_prefixes:
      - "/maps"
      - "/space"
      - "/corporate/data"
    blocked_subdomains: []
    playwright_wait_event: "domcontentloaded"
    min_content_length: 100
    user_agent: null
    content_selectors:
      - "div.mainWrap"
      - "div.fullbody-wrapper"
      - "div.text-cms-col"
      - "main"
      - "article"
    tag_config:
      property_type:
        private: ["private residential", "private property", "condominium", "landed residential"]
        commercial: ["commercial property", "industrial"]
      citizenship:
        SC: ["singapore citizen"]
        PR: ["permanent resident"]
        foreigner: ["foreigner", "non-resident"]
      topic:
        stamp_duty: ["stamp duty", "absd", "bsd"]
        property_tax: ["property tax"]
        eligibility: ["eligibility"]
        development: ["development", "planning", "guideline"]

  iras:
    schedule:
      full: "0 2 * * 0"
      incremental: "0 6 * * *"
    name: "Inland Revenue Authority of Singapore"
    base_url: "https://www.iras.gov.sg"
    start_urls:
      - "https://www.iras.gov.sg/taxes/stamp-duty"
      - "https://www.iras.gov.sg/taxes/property-tax"
    allowed_domains:
      - "www.iras.gov.sg"
      - "iras.gov.sg"
    content_types:
      - "stamp_duty"
      - "property_tax"
      - "tax_rates"
      - "reliefs"
    js_rendering: false
    crawl_delay: 2.0
    estimated_pages: 120
    respect_robots_txt: false
    target_prefixes:
      - "/taxes/stamp-duty"
      - "/taxes/property-tax"
    skip_prefixes: []
    blocked_subdomains: []
    playwright_wait_event: "domcontentloaded"
    min_content_length: 100
    user_agent: null
    content_selectors:
      - "div.sfContentBlock"
      - "article.content"
      - "main"
      - "article"
    tag_config:
      property_type:
        all: []
      citizenship:
        SC: ["singapore citizen"]
        PR: ["permanent resident"]
      topic:
        stamp_duty: ["stamp duty", "absd", "bsd", "ssd", "additional buyer", "seller stamp duty"]
        property_tax: ["property tax", "annual value"]
        ltv: ["loan-to-value", "ltv"]
        eligibility: ["eligibility", "relief"]

  mas:
    schedule:
      full: "0 2 * * 0"
      incremental: "0 6 * * *"
    name: "Monetary Authority of Singapore"
    base_url: "https://www.mas.gov.sg"
    start_urls:
      - "https://www.mas.gov.sg/regulations-and-financial-stability"
      - "https://www.mas.gov.sg/news"
    allowed_domains:
      - "www.mas.gov.sg"
      - "mas.gov.sg"
    content_types:
      - "loan_limits"
      - "tdsr"
      - "ltv"
      - "mortgage_regulations"
    js_rendering: true
    crawl_delay: 3.0
    estimated_pages: 80
    respect_robots_txt: true
    target_prefixes:
      - "/regulation/regulations-and-guidance"
      - "/news"
    skip_prefixes:
      - "/terms-of-use"
      - "/privacy"
      - "/about-mas"
      - "/careers"
      - "/contact"
      - "/statistics"
      - "/data-and-statistics"
      - "/publications/statistics"
      - "/investor-alert"
      - "/complaints"
    blocked_subdomains:
      - "eservices.mas.gov.sg"
    playwright_wait_event: "domcontentloaded"
    min_content_length: 100
    user_agent: null
    content_keywords_filter:
      - "property"
      - "mortgage"
      - "loan-to-value"
      - "ltv"
      - "tdsr"
      - "total debt servicing"
      - "housing loan"
      - "residential property"
    content_selectors:
      - "div.mas-content"
      - "div#content"
      - "main"
      - "article"
    tag_config:
      property_type:
        residential: ["residential property", "housing loan"]
        commercial: ["commercial property"]
      citizenship:
        all: []
      topic:
        ltv: ["loan-to-value", "ltv"]
        tdsr: ["tdsr", "total debt servicing"]
        msr: ["msr", "mortgage servicing ratio"]
        mortgage: ["mortgage", "housing loan", "residential property"]
        eligibility: ["eligibility", "criterion"]

  cpf:
    schedule:
      full: "0 2 * * 0"
      incremental: "0 6 * * *"
    name: "CPF Board"
    base_url: "https://www.cpf.gov.sg"
    start_urls:
      - "https://www.cpf.gov.sg/member/home-ownership"
    allowed_domains:
      - "www.cpf.gov.sg"
      - "cpf.gov.sg"
    content_types:
      - "housing_scheme"
      - "withdrawal_limits"
      - "accrued_interest"
    js_rendering: true
    crawl_delay: 2.0
    estimated_pages: 150
    respect_robots_txt: true
    target_prefixes:
      - "/member/home-ownership"
    skip_prefixes:
      - "/member/healthcare"
      - "/member/retirement"
      - "/member/account-services"
      - "/employer"
    blocked_subdomains: []
    playwright_wait_event: "networkidle"
    min_content_length: 100
    user_agent: null
    content_selectors:
      - "div#cpf-content"
      - "main"
      - "article"
    tag_config:
      property_type:
        HDB: ["hdb flat", "hdb"]
        private: ["private residential", "condominium", "private property"]
        EC: ["executive condominium", "ec "]
      citizenship:
        SC: ["singapore citizen"]
        PR: ["permanent resident"]
      topic:
        housing_grant: ["enhanced housing grant", "ehg", "family grant", "housing grant"]
        housing_scheme: ["housing scheme", "cpf housing"]
        cpf_withdrawal: ["cpf withdrawal", "ordinary account", "accrued interest"]
        first_time_buyer: ["first-time", "first time", "first timer"]
        eligibility: ["eligibility", "eligible"]
        protection_scheme: ["home protection scheme", "hps"]
        second_property: ["second property"]
