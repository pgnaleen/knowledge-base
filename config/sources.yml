# Government source definitions for crawlers
sources:
  hdb:
    name: "Housing & Development Board"
    base_url: "https://www.hdb.gov.sg"
    start_urls:
      - "https://www.hdb.gov.sg/buying-a-flat"
      - "https://www.hdb.gov.sg/managing-my-home"
      - "https://www.hdb.gov.sg/renting-a-flat"
    allowed_domains:
      - "www.hdb.gov.sg"
      - "hdb.gov.sg"
    content_types:
      - "eligibility"
      - "schemes"
      - "grants"
      - "resale_rules"
      - "bto_info"
    js_rendering: true
    crawl_delay: 2.0
    estimated_pages: 300
    respect_robots_txt: true
    target_prefixes:
      - "/buying-a-flat"
      - "/managing-my-home"
      - "/renting-a-flat"

  ura:
    name: "Urban Redevelopment Authority"
    base_url: "https://www.ura.gov.sg"
    start_urls:
      - "https://www.ura.gov.sg/Corporate/Property"
      - "https://www.ura.gov.sg/Corporate/Guidelines"
    allowed_domains:
      - "www.ura.gov.sg"
      - "ura.gov.sg"
    content_types:
      - "property_guidelines"
      - "development_rules"
      - "private_property_regulations"
    js_rendering: false
    crawl_delay: 2.0
    estimated_pages: 250
    respect_robots_txt: true
    target_prefixes:
      - "/Corporate/Property"
      - "/Corporate/Guidelines"

  iras:
    name: "Inland Revenue Authority of Singapore"
    base_url: "https://www.iras.gov.sg"
    start_urls:
      - "https://www.iras.gov.sg/taxes/stamp-duty"
      - "https://www.iras.gov.sg/taxes/property-tax"
    allowed_domains:
      - "www.iras.gov.sg"
      - "iras.gov.sg"
    content_types:
      - "stamp_duty"
      - "property_tax"
      - "tax_rates"
      - "reliefs"
    js_rendering: false
    crawl_delay: 2.0
    estimated_pages: 120
    respect_robots_txt: true
    target_prefixes:
      - "/taxes/stamp-duty"
      - "/taxes/property-tax"

  mas:
    name: "Monetary Authority of Singapore"
    base_url: "https://www.mas.gov.sg"
    start_urls:
      - "https://www.mas.gov.sg/regulations-and-financial-stability"
      - "https://www.mas.gov.sg/news"
    allowed_domains:
      - "www.mas.gov.sg"
      - "mas.gov.sg"
    content_types:
      - "loan_limits"
      - "tdsr"
      - "ltv"
      - "mortgage_regulations"
    js_rendering: true
    crawl_delay: 3.0
    estimated_pages: 80
    respect_robots_txt: true
    target_prefixes:
      - "/regulation/regulations-and-guidance"
      - "/news"

  cpf:
    name: "CPF Board"
    base_url: "https://www.cpf.gov.sg"
    start_urls:
      - "https://www.cpf.gov.sg/member/home-ownership"
    allowed_domains:
      - "www.cpf.gov.sg"
      - "cpf.gov.sg"
    content_types:
      - "housing_scheme"
      - "withdrawal_limits"
      - "accrued_interest"
    js_rendering: true
    crawl_delay: 2.0
    estimated_pages: 150
    respect_robots_txt: true
    target_prefixes:
      - "/member/home-ownership"
